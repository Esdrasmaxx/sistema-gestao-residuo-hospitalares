const gBadge=s=>{const g=G[gk(s)];return `<span class="inline-flex items-center gap-1.5 rounded-md px-2 py-0.5 text-xs font-medium whitespace-nowrap" style="background:${g.bg};color:${g.fg}"><span class="w-1.5 h-1.5 rounded-full" style="background:${g.hex}"></span>${g.short} · ${g.desc}</span>`};

/* Tratamento exigido por método de destinação */
const METODOS=['Autoclavação','Incineração','Aterro Industrial','Aterro Sanitário','Decaimento Radioativo','Coprocessamento','Reciclagem'];
const COMPAT=[[/autoclav/i,['A'],'Autoclavação'],[/incinera/i,['A','B','E'],'Incineração'],[/industrial/i,['B'],'Aterro Industrial'],[/sanit[áa]rio/i,['D'],'Aterro Sanitário'],[/decaimento|radioativ/i,['C'],'Decaimento Radioativo']];
const metodoOf=e=>{const p=String(e||'').split(' - ');return p.length>1?p[p.length-1]:'—'};
const nomeEmpresa=e=>{const p=String(e||'').split(' - ');return p.length>1?p.slice(0,-1).join(' - '):e};
function compat(grupo,desc){
  if(!desc)return {ok:null};
  const m=metodoOf(desc.empresa), rule=COMPAT.find(r=>r[0].test(m)); if(!rule)return {ok:null};
  const ok=rule[1].includes(grupo), g=G[grupo];
  if(ok)return {ok,msg:`${m} é um destino válido para o ${g.short} (${g.desc}).`};
  const accepted=COMPAT.filter(r=>r[1].includes(grupo)).map(r=>r[2]).join(', ');
  return {ok,msg:`${m} não recebe ${g.short} (${g.desc}). Destinos aceitos: ${accepted}.`};
}

/* ===== UI básica: toast e modal ===== */
function toast(msg,type='ok'){
  const c={ok:'bg-emerald-600',err:'bg-rose-600',warn:'bg-amber-600'}[type];
  const el=document.createElement('div');
  el.className=`toast-in pointer-events-auto flex items-center gap-2.5 ${c} text-white text-sm font-medium rounded-lg shadow-lg px-4 py-3 max-w-md`;
  el.innerHTML=`${ic(type==='ok'?'check':'warn',18)}<span>${esc(msg)}</span>`;
  $('#toast-root').appendChild(el); setTimeout(()=>el.remove(),4200);
}
function closeModal(){$('#modal-root').innerHTML='';document.removeEventListener('keydown',escKey)}
const escKey=e=>{if(e.key==='Escape')closeModal()};
function openModal({title,sub,body,submit='Salvar',tone='indigo',onSubmit,wide}){
  const btn={indigo:'bg-indigo-700 hover:bg-indigo-800',red:'bg-rose-600 hover:bg-rose-700',green:'bg-emerald-600 hover:bg-emerald-700'}[tone];
  $('#modal-root').innerHTML=`<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4"><div class="absolute inset-0 bg-slate-900/50" data-action="close-modal"></div>
  <form id="modal-form" novalidate class="modal-in relative bg-white w-full ${wide?'sm:max-w-2xl':'sm:max-w-lg'} rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[92vh] flex flex-col">
   <div class="flex items-start gap-3 px-6 pt-5 pb-4 border-b border-slate-100"><div class="min-w-0"><h2 class="text-lg font-semibold tracking-tight">${esc(title)}</h2>${sub?`<p class="text-sm text-slate-500 mt-0.5">${esc(sub)}</p>`:''}</div><button type="button" class="ml-auto p-1.5 -mr-1.5 text-slate-400 hover:text-slate-700" aria-label="Fechar" data-action="close-modal">${ic('x')}</button></div>
   <div class="px-6 py-5 overflow-y-auto scroll-thin">${body}</div>
   <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 px-6 py-4 bg-slate-50 rounded-b-2xl border-t border-slate-100"><button type="button" class="px-4 py-2.5 rounded-lg text-sm font-medium text-slate-700 bg-white border border-slate-300 hover:bg-slate-50" data-action="close-modal">Cancelar</button><button type="submit" class="px-4 py-2.5 rounded-lg text-sm font-semibold text-white ${btn}">${esc(submit)}</button></div></form></div>`;
  document.addEventListener('keydown',escKey);
  const f=$('#modal-form'); f.addEventListener('submit',e=>{e.preventDefault();onSubmit&&onSubmit(f)});
  const first=f.querySelector('input,select,textarea'); if(first)first.focus();
}
const confirmDel=(title,text,fn)=>openModal({title,body:`<p class="text-sm text-slate-600">${text}</p>`,submit:'Excluir',tone:'red',onSubmit:()=>{closeModal();fn()}});

/* ===== Campos de formulário ===== */
function fieldHTML(f,v){
  const id='f_'+f.name, val=v??f.value??'';
  let input;
  if(f.type==='select'){
    input=`<select id="${id}" name="${f.name}" class="field" ${f.required?'required':''}><option value="">${esc(f.placeholder||'Selecione')}</option>${f.options().map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(val)?'selected':''}>${esc(o.l)}</option>`).join('')}</select>`;
  }else{
    input=`<input id="${id}" name="${f.name}" type="${f.type||'text'}" ${f.step?`step="${f.step}"`:''} ${f.min!=null?`min="${f.min}"`:''} value="${esc(val)}" placeholder="${esc(f.placeholder||'')}" maxlength="${f.max||100}" class="field" ${f.required?'required':''} ${f.list?`list="${f.list}"`:''} autocomplete="off">`;
  }
  return `<div class="${f.span2?'sm:col-span-2':''}"><label for="${id}" class="block text-sm font-medium text-slate-700 mb-1.5">${esc(f.label)}${f.required?'<span class="text-rose-500"> *</span>':''}</label>${input}${f.hint?`<p class="text-xs text-slate-500 mt-1">${esc(f.hint)}</p>`:''}<p class="text-xs text-rose-600 mt-1 hidden" data-err="${f.name}">Campo obrigatório</p></div>`;
}
function readForm(form,fields){
  const out={};let ok=true;
  fields.forEach(f=>{
    const el=form.elements[f.name]; let v=el.value.trim();
    const err=form.querySelector(`[data-err="${f.name}"]`);
    let bad=f.required&&!v;
    if(!bad&&f.type==='number'&&(isNaN(+v)||+v<=0))bad=true;
    el.classList.toggle('err',bad); err.classList.toggle('hidden',!bad);
    if(bad){ok=false;if(f.type==='number')err.textContent='Informe um valor maior que zero'}
    out[f.name]=v;
  });
  if(!ok){const b=form.querySelector('.err');b&&b.focus();return null}
  return out;
}

/* ===== Dashboard ===== */
function dashboard(){
  const now=new Date(),today=sod(now),yday=addDays(today,-1),from30=addDays(today,-29);
  const cm=new Map(DB.coletas.map(c=>[c.id,c]));
  const withDate=DB.residuos.filter(r=>r.coleta&&cm.has(r.coleta)).map(r=>({...r,d:new Date(cm.get(r.coleta).dt)}));
  const sum=a=>a.reduce((s,r)=>s+r.peso,0);
  const hoje=withDate.filter(r=>dayKey(r.d)===dayKey(today)), ont=withDate.filter(r=>dayKey(r.d)===dayKey(yday));
  const delta=sum(ont)?((sum(hoje)-sum(ont))/sum(ont)*100):null;
  const m30=withDate.filter(r=>r.d>=from30);
  const pend=DB.coletas.filter(c=>new Date(c.dt)>=yday);
  const bySet={};m30.filter(r=>gk(r.grupo)!=='D').forEach(r=>{bySet[r.setor]=(bySet[r.setor]||0)+r.peso});
  const top=Object.entries(bySet).sort((a,b)=>b[1]-a[1])[0];
  const perig=sum(m30.filter(r=>gk(r.grupo)!=='D')),tot30=sum(m30);
  const card=(icn,tint,label,val,sub,extra='')=>`<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 flex gap-4"><div class="w-11 h-11 shrink-0 rounded-xl grid place-items-center ${tint}">${ic(icn,22)}</div><div class="min-w-0"><div class="text-sm text-slate-500">${label}</div><div class="text-2xl font-semibold tracking-tight num mt-0.5 leading-tight break-words">${val}</div><div class="text-xs text-slate-500 mt-1">${sub}</div>${extra}</div></div>`;
  const dBadge=delta==null?'':`<span class="${delta>0?'text-rose-600':'text-emerald-600'} font-medium">${delta>0?'▲':'▼'} ${Math.abs(Math.round(delta))}%</span> vs. ontem`;
  // gráfico: 14 dias empilhados por grupo
  const days=Array.from({length:14},(_,i)=>addDays(today,i-13));
  const data=days.map(d=>{const o={d,t:0};Object.keys(G).forEach(k=>o[k]=0);withDate.filter(r=>dayKey(r.d)===dayKey(d)).forEach(r=>{o[gk(r.grupo)]+=r.peso;o.t+=r.peso});return o});
  const mx=Math.max(1,...data.map(x=>x.t)),step=[5,10,20,25,50,100,200,250,500].find(s=>mx/s<=5)||1000,ymax=Math.ceil(mx/step)*step;

  </div>

     <div class="ml-auto flex flex-wrap gap-x-3 gap-y-1 text-xs text-slate-600">${Object.values(G).map(g=>`<span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm" style="background:${g.hex}"></span>${g.short}</span>`).join('')}</div></div>${svg}</section>

     <div class="space-y-3.5">${byG.map(x=>`<div><div class="flex justify-between text-sm mb-1.5"><span class="font-medium text-slate-700">${G[x.k].short} <span class="text-slate-400 font-normal">· ${G[x.k].desc}</span></span><span class="num text-slate-600">${kgs(x.v)}</span></div><div class="h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full" style="width:${x.v/gmax*100}%;background:${G[x.k].hex}"></div></div></div>`).join('')}</div>

/* ===== Saída de Resíduo ===== */
let SA={nome:'',grupo:'',setor:'',func:'',peso:'',descarte:'',dt:'',last:null};
const nowLocal=()=>iso(new Date()).slice(0,16);

  const lbl=(t,id,req=true)=>`<label for="${id}" class="block text-sm font-medium text-slate-700 mb-1.5">${t}${req?'<span class="text-rose-500"> *</span>':''}</label>`;
  return `<div class="grid grid-cols-1 xl:grid-cols-3 gap-6 items-start">
  <form id="saida-form" novalidate class="xl:col-span-2 bg-white rounded-xl border border-slate-200 shadow-sm min-w-0">

   <div class="p-5 sm:p-6 grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-5">
     <div class="sm:col-span-2">${lbl('Resíduo','s_nome')}<input id="s_nome" list="dl-res" class="field" placeholder="Digite ou escolha: seringas, placenta, revelador de Raio-X…" value="${esc(SA.nome)}" autocomplete="off" maxlength="100"><datalist id="dl-res">${Object.keys(cat).sort().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
       <div class="flex flex-wrap gap-1.5 mt-2">${quick.map(n=>`<button type="button" data-quick="${esc(n)}" class="text-xs px-2.5 py-1.5 rounded-full border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-200 text-slate-600 text-left">${esc(n.length>38?n.slice(0,36)+'…':n)}</button>`).join('')}</div></div>
     <div class="sm:col-span-2">${lbl('Grupo ANVISA','s_grupo')}${sel('s_grupo',Object.values(G).map(g=>({v:g.name,l:g.name})),'Selecione o grupo',SA.grupo)}</div>
     <div>${lbl('Setor de origem','s_setor')}${sel('s_setor',DB.setores.map(s=>({v:s.id,l:s.nome})),'Selecione o setor',SA.setor)}</div>
     <div>${lbl('Funcionário que entrega','s_func')}${sel('s_func',[...DB.funcs].sort((a,b)=>a.nome.localeCompare(b.nome)).map(f=>({v:f.nome,l:f.nome})),'Selecione o funcionário',SA.func)}</div>
     <div>${lbl('Peso (kg)','s_peso')}<div class="flex"><button type="button" data-step="-0.5" class="px-3.5 rounded-l-lg border border-r-0 border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-600 text-lg" aria-label="Diminuir 0,5 kg">−</button><input id="s_peso" type="number" inputmode="decimal" step="0.01" min="0" class="field rounded-none text-center num text-lg font-semibold" placeholder="0,00" value="${esc(SA.peso)}"><button type="button" data-step="0.5" class="px-3.5 rounded-r-lg border border-l-0 border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-600 text-lg" aria-label="Aumentar 0,5 kg">+</button></div>
       <div class="flex gap-1.5 mt-2">${[1,2,5,10,25].map(v=>`<button type="button" data-peso="${v}" class="text-xs num px-2.5 py-1 rounded-md border border-slate-200 bg-slate-50 hover:bg-indigo-50 text-slate-600">${v} kg</button>`).join('')}</div></div>
     <div>${lbl('Data e hora da coleta','s_dt')}<input id="s_dt" type="datetime-local" class="field num" value="${SA.dt}"></div>

     <div id="s_alert" class="sm:col-span-2"></div>
   </div>

  </form>
  <div class="space-y-6 min-w-0">

  </div></div>`;

function saidaSync(){
  const g=gk(SA.grupo),desc=descOf(SA.descarte),hasG=!!SA.grupo,res=hasG?compat(g,desc):{ok:null};
  const al=$('#s_alert');
  if(al)al.innerHTML=res.ok===false?`<div class="flex gap-3 rounded-lg border border-rose-200 bg-rose-50 p-3.5 text-sm text-rose-800">${ic('warn',20,'shrink-0 mt-0.5')}<div><b>Destino incompatível.</b> ${esc(res.msg)}</div></div>`:res.ok===true?`<div class="flex gap-3 rounded-lg border border-emerald-200 bg-emerald-50 p-3.5 text-sm text-emerald-800">${ic('shield',20,'shrink-0 mt-0.5')}<div>${esc(res.msg)}</div></div>`:'';
  const b=$('#s_submit');if(b)b.disabled=res.ok===false;
  const p=$('#s_prev');if(!p)return;
  const row=(k,v)=>`<div class="flex justify-between gap-4 py-2 text-sm"><dt class="text-slate-500 shrink-0">${k}</dt><dd class="text-right font-medium min-w-0 break-words">${v||'<span class="text-slate-300">—</span>'}</dd></div>`;
  p.innerHTML=`<dl class="divide-y divide-slate-100">${row('Resíduo',esc(SA.nome))}${row('Grupo',hasG?gBadge(SA.grupo):'')}${row('Risco',hasG?rBadge(SA.grupo):'')}${row('Setor',SA.setor?esc(setorNome(SA.setor)):'')}${row('Funcionário',esc(SA.func))}${row('Peso',SA.peso?`<span class="num">${kgs(SA.peso)}</span>`:'')}${row('Destino',desc?esc(metodoOf(desc.empresa)):'')}</dl>`;
}
function saidaSubmit(){
  const need=[['s_nome',SA.nome],['s_grupo',SA.grupo],['s_setor',SA.setor],['s_func',SA.func],['s_peso',+SA.peso>0],['s_desc',SA.descarte],['s_dt',SA.dt]];
  let bad=false;need.forEach(([id,v])=>{const e=$('#'+id),f=!v;e.classList.toggle('err',f);if(f&&!bad){e.focus();bad=true}});
  if(bad){toast('Preencha todos os campos obrigatórios.','err');return}
  const d=descOf(SA.descarte);if(compat(gk(SA.grupo),d).ok===false){toast('Escolha um destino compatível com o grupo do resíduo.','err');return}
  const cid=nextId(DB.coletas),rid=nextId(DB.residuos);
  DB.coletas.push({id:cid,dt:SA.dt+':00',func:SA.func,descarte:+SA.descarte});
  DB.residuos.push({id:rid,nome:SA.nome.trim(),grupo:SA.grupo,peso:+(+SA.peso).toFixed(2),setor:+SA.setor,coleta:cid});
  save();SA.last={coleta:cid,res:rid,nome:SA.nome.trim(),peso:+SA.peso};
  SA.nome='';SA.grupo='';SA.peso='';SA.dt=nowLocal();
  toast(`Saída registrada: coleta #${cid}, ${kgs(SA.last.peso)}.`);route(true);
}

const NAV=[{sec:'Operação',items:[['dashboard','Dashboard','home'],['saida','Saída de Resíduo','out']]},{sec:'Cadastros',items:[['residuos','Resíduos','trash2'],['funcionarios','Funcionários','users'],['setores','Setores','building'],['empresas','Empresas de Descarte','truck']]}];

const openNav=()=>{$('#sidebar').classList.remove('-translate-x-full');$('#overlay').classList.remove('hidden')};

/* ===== Eventos ===== */
document.addEventListener('click',e=>{

  if(a==='close-modal')closeModal();

  else if(a==='edit')openForm(t.dataset.ent,t.dataset.id);
  else if(a==='del'){const E=ENT[t.dataset.ent],r=E.get(t.dataset.id),b=E.blocked(r);
    if(b)openModal({title:'Não é possível excluir',body:`<div class="flex gap-3 text-sm text-slate-700">${ic('warn',22,'text-amber-500 shrink-0')}<p>${esc(b)}</p></div>`,submit:'Entendi',tone:'indigo',onSubmit:closeModal});
    else confirmDel(`Excluir ${E.noun.toLowerCase()}?`,E.delText(r),()=>{E.remove(r.id);save();toast(`${E.noun} excluído.`);route(true)})}
  else if(a==='reset')openModal({title:'Restaurar dados de exemplo?',body:'<p class="text-sm text-slate-600">Todos os registros criados ou alterados neste navegador serão substituídos pelos dados de exemplo.</p>',submit:'Restaurar',tone:'red',onSubmit:()=>{DB=seedState();save();SA={nome:'',grupo:'',setor:'',func:'',peso:'',descarte:'',dt:'',last:null};closeModal();toast('Dados de exemplo restaurados.');route()}});

  else if(t.dataset.page){const s=tstate[t.dataset.page];s.page+=+t.dataset.dir;route(true)}
  else if(t.dataset.filter){const s=tstate[t.dataset.filter];s.filter=s.filter===t.dataset.v?'':t.dataset.v;s.page=1;route(true)}

});
document.addEventListener('input',e=>{
